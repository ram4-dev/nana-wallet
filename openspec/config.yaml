schema: spec-driven

context: |
  Project: Nana Wallet, Aleph Hackathon.
  Repository state: Node.js 22 TypeScript Fastify backend plus independent React 19/TanStack frontend in apps/nana-wallet, connected only by HTTP.
  Stack: Fastify, LiveKit Agents, Privy, WDK, PostgreSQL/pgvector, Vitest, Playwright, ESLint, TypeScript.
  Frontend quality tools: Vitest, Testing Library, ESLint, TypeScript, Prettier.
  Canonical planning document: docs/architecture.md.
  Artifact persistence: OpenSpec files under openspec/.
  Active implementation worktree: feat/onboarding-roles.

strict_tdd: false

testing:
  status: available
  test_command: "npm test"
  framework: Vitest
  unit: true
  integration: true
  e2e: true
  coverage: false
  coverage_command: ""
  linter: true
  lint_command: "npm run lint"
  type_checker: true
  typecheck_command: "npm run typecheck"
  formatter: true
  format_command: "cd apps/nana-wallet && npm run format"
  notes: "Backend integration requires the local pgvector compose service. Backend WDK and LiveKit E2E paths are opt-in through their documented environment variables; browser E2E uses Playwright. Frontend commands run from apps/nana-wallet/. Coverage tooling exists in the frontend but no coverage script is configured."

rules:
  proposal:
    - Keep scope aligned with the approved change and Nana front/backend HTTP boundary in docs/architecture.md.
    - Include a rollback plan for risky changes involving wallet or transaction behavior.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Preserve the explicit demo boundary and testnet-only scope.
  design:
    - Document architecture decisions with rationale.
    - Include sequence diagrams for conversational transfer and WDK tool flows.
  tasks:
    - Group work by phase and use hierarchical numbering.
    - Keep tasks completable in one session.
  apply:
    guidelines:
      - Follow the implementation plan and existing project conventions.
      - Keep strict TDD disabled per the existing repository setting; use focused Vitest coverage and runtime harnesses.
    tdd: false
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas into main specifications.
