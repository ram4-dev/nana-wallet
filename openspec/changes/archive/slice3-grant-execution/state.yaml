notes: >
  Slice 3 of the approved plan at
  .agent-workflow/tasks/financial-assistant-development/01-propuesta-plan.md.
  Wire the Slice 1 grant engine into the conversation execution path: a transfer
  fully covered by an already-active, non-expired, policy-ready grant executes
  without the second explicit confirmation; everything else degrades closed to
  preview + explicit confirmation. Q1-Q4 are orchestrator-selected conservative
  design resolutions within the Ramiro-approved slice scope (execute only when
  fully covered; fail closed otherwise), revisable at the design gate. Key
  steers bound into design: eligibility restricted to authenticated original
  user turn/transcript with explicit transfer intent binding exact amount and
  resolved recipient (model-produced tool calls keep explicit confirmation this
  slice; Slice 4 keeps voice-confirmation UX); coverage bound to the original
  request timestamp so later grants never auto-execute older pending previews;
  claimConsumption sole atomic authority with structural no-consumedInWindow
  pre-filter; fail-closed units conversion via provider listTokens decimals;
  deterministic least-privilege candidate selection with next-candidate claim
  fallback; idempotency key grant-exec:{userId}:{attemptId} from the persisted
  preview attempt; covered path reuses the existing `sent` turn-result shape
  (zero contract delta expected; mirror obligation = no-op assertion). D-2/
  D-3/D-4/D-7 preserved; no provider signing/submission/finality changes; no
  LiveKit tool surface changes. PR stacked on
